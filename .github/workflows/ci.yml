# Standard workflow config of chatmail/workflow's py-checks flow.

name: CI

on:
  push:
    branches: [ main ]
    tags-ignore: [ '**' ]
  # No branch filter as stacked PRs target their parent branch, not main,
  # and would otherwise run no checks.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  py-checks:
    uses: chatmail/workflows/.github/workflows/py-checks.yml@main
